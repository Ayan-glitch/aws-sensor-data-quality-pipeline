name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the version this project was actually developed and
          # verified against, see requirements.txt for why pyarrow's
          # lower bound matters here, an older pyarrow has no prebuilt
          # wheel for newer Python versions and fails to build from source.
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic sample data
        run: python scripts/generate_sample_data.py

      - name: Run tests
        run: pytest -v
